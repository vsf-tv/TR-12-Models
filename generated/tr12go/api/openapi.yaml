openapi: 3.0.2
info:
  title: HostServiceApi
  version: "1.0"
servers:
- url: /
paths:
  /authenticate:
    post:
      operationId: AuthenticatePairingCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticatePairingCodeRequestContent"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatePairingCodeResponseContent"
          description: AuthenticatePairingCode 200 response
  /internal/host-config:
    get:
      description: Host publishes host configuration to device on connect.
      operationId: GetHostConfig
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetHostConfigResponseContent"
          description: GetHostConfig 200 response
  /internal/version:
    get:
      description: Host publishes protocol version to device.
      operationId: GetVersion
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetVersionResponseContent"
          description: GetVersion 200 response
  /mqtt/device-to-host/actual-configuration:
    post:
      description: |-
        Device publishes its actual applied configuration.
        Topic: devicePublishesActualConfigurationTopic
      operationId: DevicePublishesActualConfiguration
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePublishesActualConfigurationRequestContent"
        required: true
      responses:
        "200":
          description: DevicePublishesActualConfiguration 200 response
  /mqtt/device-to-host/deprovision-acknowledgement:
    post:
      description: |-
        Device acknowledges deprovision by publishing to this topic.
        Topic: devicePublishesDeprovisionAcknowledgementTopic
      operationId: DevicePublishesDeprovisionAcknowledgement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePublishesDeprovisionAcknowledgementRequestContent"
        required: true
      responses:
        "200":
          description: DevicePublishesDeprovisionAcknowledgement 200 response
  /mqtt/device-to-host/registration:
    post:
      description: |-
        Device publishes its registration on connect.
        Topic: devicePublishesRegistrationTopic
      operationId: DevicePublishesRegistration
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePublishesRegistrationRequestContent"
        required: true
      responses:
        "200":
          description: DevicePublishesRegistration 200 response
  /mqtt/device-to-host/status:
    post:
      description: |-
        Device publishes its current status.
        Topic: devicePublishesStatusTopic
      operationId: DevicePublishesStatus
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePublishesStatusRequestContent"
        required: true
      responses:
        "200":
          description: DevicePublishesStatus 200 response
  /mqtt/host-to-device/certificate-rotation:
    post:
      description: |-
        Host publishes new certificates to the device.
        Topic: deviceSubscribesToCertificateRotationTopic
      operationId: DeviceSubscribesToCertificateRotation
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSubscribesToCertificateRotationResponseContent"
          description: DeviceSubscribesToCertificateRotation 200 response
  /mqtt/host-to-device/deprovision:
    post:
      description: |-
        Host publishes deprovision command to the device.
        Topic: deviceSubscribesToDeprovisionTopic
      operationId: DeviceSubscribesToDeprovision
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSubscribesToDeprovisionResponseContent"
          description: DeviceSubscribesToDeprovision 200 response
  /mqtt/host-to-device/desired-configuration:
    post:
      description: |-
        Host publishes desired configuration to the device.
        Topic: deviceSubscribesToDesiredConfigurationTopic
      operationId: DeviceSubscribesToDesiredConfiguration
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSubscribesToDesiredConfigurationResponseContent"
          description: DeviceSubscribesToDesiredConfiguration 200 response
  /mqtt/host-to-device/log-subscription:
    post:
      description: |-
        Host publishes log upload request to the device.
        Topic: deviceSubscribesToLogSubscriptionTopic
      operationId: DeviceSubscribesToLogSubscription
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSubscribesToLogSubscriptionResponseContent"
          description: DeviceSubscribesToLogSubscription 200 response
  /mqtt/host-to-device/thumbnail-subscription:
    post:
      description: |-
        Host publishes thumbnail subscription requests to the device.
        Topic: deviceSubscribesToThumbnailSubscriptionTopic
      operationId: DeviceSubscribesToThumbnailSubscription
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSubscribesToThumbnailSubscriptionResponseContent"
          description: DeviceSubscribesToThumbnailSubscription 200 response
  /pair:
    post:
      operationId: CreatePairingCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePairingCodeRequestContent"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePairingCodeResponseContent"
          description: CreatePairingCode 200 response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePairingCodeExceptionResponseContent"
          description: CreatePairingCodeException 400 response
