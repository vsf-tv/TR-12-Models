openapi: 3.0.2
info:
  title: HostServiceApi
  version: "1.0"
servers:
- url: /
paths:
  /authenticate:
    post:
      operationId: AuthenticatePairingCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticatePairingCodeRequestContent"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatePairingCodeResponseContent"
          description: AuthenticatePairingCode 200 response
  /internal/host-config:
    get:
      description: Host publishes host configuration to device on connect.
      operationId: GetHostConfig
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetHostConfigResponseContent"
          description: GetHostConfig 200 response
  /internal/version:
    get:
      description: Host publishes protocol version to device.
      operationId: GetVersion
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetVersionResponseContent"
          description: GetVersion 200 response
  /mqtt/device-to-host/actual-configuration:
    post:
      description: |-
        Device publishes its actual applied configuration.
        Topic: devicePublishesActualConfigurationTopic
        Payload shape: DeviceConfiguration (see cdd_sdk smithy)
      operationId: DevicePublishesActualConfiguration
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePublishesActualConfigurationRequestContent"
      responses:
        "200":
          description: DevicePublishesActualConfiguration 200 response
  /mqtt/device-to-host/deprovision-acknowledgement:
    post:
      description: |-
        Device acknowledges deprovision by publishing to this topic.
        Topic: devicePublishesDeprovisionAcknowledgementTopic
      operationId: DevicePublishesDeprovisionAcknowledgement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePublishesDeprovisionAcknowledgementRequestContent"
        required: true
      responses:
        "200":
          description: DevicePublishesDeprovisionAcknowledgement 200 response
  /mqtt/device-to-host/registration:
    post:
      description: |-
        Device publishes its registration on connect.
        Topic: devicePublishesRegistrationTopic
        Payload shape: DeviceRegistration (see cdd_sdk smithy)
      operationId: DevicePublishesRegistration
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePublishesRegistrationRequestContent"
      responses:
        "200":
          description: DevicePublishesRegistration 200 response
  /mqtt/device-to-host/status:
    post:
      description: |-
        Device publishes its current status.
        Topic: devicePublishesStatusTopic
        Payload shape: DeviceStatus (see cdd_sdk smithy)
      operationId: DevicePublishesStatus
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePublishesStatusRequestContent"
      responses:
        "200":
          description: DevicePublishesStatus 200 response
  /mqtt/host-to-device/certificate-rotation:
    post:
      description: |-
        Host publishes new certificates to the device.
        Topic: deviceSubscribesToCertificateRotationTopic
      operationId: DeviceSubscribesToCertificateRotation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceSubscribesToCertificateRotationRequestContent"
        required: true
      responses:
        "200":
          description: DeviceSubscribesToCertificateRotation 200 response
  /mqtt/host-to-device/deprovision:
    post:
      description: |-
        Host publishes deprovision command to the device.
        Topic: deviceSubscribesToDeprovisionTopic
      operationId: DeviceSubscribesToDeprovision
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceSubscribesToDeprovisionRequestContent"
        required: true
      responses:
        "200":
          description: DeviceSubscribesToDeprovision 200 response
  /mqtt/host-to-device/desired-configuration:
    post:
      description: |-
        Host publishes desired configuration to the device.
        Topic: deviceSubscribesToDesiredConfigurationTopic
        Payload shape: DeviceConfiguration (see cdd_sdk smithy)
      operationId: DeviceSubscribesToDesiredConfiguration
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceSubscribesToDesiredConfigurationRequestContent"
      responses:
        "200":
          description: DeviceSubscribesToDesiredConfiguration 200 response
  /mqtt/host-to-device/log-subscription:
    post:
      description: |-
        Host publishes log upload request to the device.
        Topic: deviceSubscribesToLogSubscriptionTopic
      operationId: DeviceSubscribesToLogSubscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceSubscribesToLogSubscriptionRequestContent"
      responses:
        "200":
          description: DeviceSubscribesToLogSubscription 200 response
  /mqtt/host-to-device/thumbnail-subscription:
    post:
      description: |-
        Host publishes thumbnail subscription requests to the device.
        Topic: deviceSubscribesToThumbnailSubscriptionTopic
      operationId: DeviceSubscribesToThumbnailSubscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceSubscribesToThumbnailSubscriptionRequestContent"
        required: true
      responses:
        "200":
          description: DeviceSubscribesToThumbnailSubscription 200 response
  /pair:
    post:
      operationId: CreatePairingCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePairingCodeRequestContent"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePairingCodeResponseContent"
          description: CreatePairingCode 200 response
components:
  schemas:
    AuthenticatePairingCodeRequestContent:
      example:
        accessCode: accessCode
        deviceId: deviceId
        pairingCode: pairingCode
      properties:
        deviceId:
          type: string
        pairingCode:
          format: password
          type: string
        accessCode:
          format: password
          type: string
      required:
      - accessCode
      - deviceId
      - pairingCode
      type: object
    AuthenticatePairingCodeResponseContent:
      example:
        regionName: regionName
        hostSettings:
          pairingTimeoutSeconds: 0.8008281904610115
          deviceSubscribesToThumbnailSubscriptionTopic: deviceSubscribesToThumbnailSubscriptionTopic
          deviceSubscribesToDeprovisionTopic: deviceSubscribesToDeprovisionTopic
          devicePublishesStatusTopic: devicePublishesStatusTopic
          deviceSubscribesToCertificateRotationTopic: deviceSubscribesToCertificateRotationTopic
          minimumIntervalPublishSeconds: 6.027456183070403
          devicePublishesRegistrationTopic: devicePublishesRegistrationTopic
          deviceSubscribesToLogSubscriptionTopic: deviceSubscribesToLogSubscriptionTopic
          deviceSubscribesToDesiredConfigurationTopic: deviceSubscribesToDesiredConfigurationTopic
          mqttKeepaliveSeconds: 1.4658129805029452
          mqttAlpnProtocol: mqttAlpnProtocol
          devicePublishesActualConfigurationTopic: devicePublishesActualConfigurationTopic
          devicePublishesDeprovisionAcknowledgementTopic: devicePublishesDeprovisionAcknowledgementTopic
        mqttUri: mqttUri
        caCertificate: caCertificate
        deviceCertificate: deviceCertificate
        status: STANDBY
      properties:
        status:
          $ref: "#/components/schemas/PairingCodeAuthorizedStatus"
        caCertificate:
          format: password
          type: string
        deviceCertificate:
          format: password
          type: string
        mqttUri:
          type: string
        regionName:
          type: string
        hostSettings:
          $ref: "#/components/schemas/HostSettings"
      required:
      - status
      type: object
    CreatePairingCodeFailureData:
      properties:
        reason:
          $ref: "#/components/schemas/CreatePairingCodeFailureReason"
      required:
      - reason
      type: object
    CreatePairingCodeFailureReason:
      enum:
      - HOST_ID_MISMATCH
      - VERSION_NOT_SUPPORTED
      - DEVICE_TYPE_NOT_SUPPORTED
      type: string
    CreatePairingCodeRequestContent:
      example:
        deviceType: SOURCE
        certificateSigningRequest: certificateSigningRequest
        hostId: hostId
        version:
          version: 4.0.0
      properties:
        deviceType:
          $ref: "#/components/schemas/DeviceType"
        hostId:
          type: string
        certificateSigningRequest:
          description: A PEM-encoded certificate signing request. Treated as sensitive.
          format: password
          type: string
        version:
          $ref: "#/components/schemas/ProtocolVersion"
      required:
      - certificateSigningRequest
      - deviceType
      - hostId
      - version
      type: object
    CreatePairingCodeResponseContent:
      example:
        result:
          success:
            pairingTimeoutSeconds: 0.8008281904610115
            accessCode: accessCode
            deviceId: deviceId
            pairingCode: pairingCode
      properties:
        result:
          $ref: "#/components/schemas/CreatePairingCodeResult"
      required:
      - result
      type: object
    CreatePairingCodeResult:
      oneOf:
      - $ref: "#/components/schemas/success"
      - $ref: "#/components/schemas/failure"
    CreatePairingCodeSuccessData:
      example:
        pairingTimeoutSeconds: 0.8008281904610115
        accessCode: accessCode
        deviceId: deviceId
        pairingCode: pairingCode
      properties:
        deviceId:
          type: string
        pairingCode:
          format: password
          type: string
        accessCode:
          format: password
          type: string
        pairingTimeoutSeconds:
          type: number
      required:
      - accessCode
      - deviceId
      - pairingCode
      - pairingTimeoutSeconds
      type: object
    DeprovisionReason:
      enum:
      - DEPROVISIONED
      - EXPIRED
      - UNKNOWN
      type: string
    DevicePublishesActualConfigurationRequestContent:
      description: Opaque MQTT payload — shape defined in cdd_sdk smithy.
      example:
        payload: ""
      properties:
        payload: {}
      type: object
    DevicePublishesDeprovisionAcknowledgementRequestContent:
      example:
        reason: DEPROVISIONED
        timestamp: 2000-01-23T04:56:07.000+00:00
      properties:
        reason:
          $ref: "#/components/schemas/DeprovisionReason"
        timestamp:
          format: date-time
          type: string
      required:
      - timestamp
      type: object
    DevicePublishesRegistrationRequestContent:
      description: Opaque MQTT payload — shape defined in cdd_sdk smithy.
      example:
        payload: ""
      properties:
        payload: {}
      type: object
    DevicePublishesStatusRequestContent:
      description: Opaque MQTT payload — shape defined in cdd_sdk smithy.
      example:
        payload: ""
      properties:
        payload: {}
      type: object
    DeviceSubscribesToCertificateRotationRequestContent:
      example:
        regionName: regionName
        mqttUri: mqttUri
        deviceCertificate: deviceCertificate
      properties:
        mqttUri:
          type: string
        deviceCertificate:
          format: password
          type: string
        regionName:
          type: string
      required:
      - deviceCertificate
      - mqttUri
      type: object
    DeviceSubscribesToDeprovisionRequestContent:
      example:
        reason: DEPROVISIONED
        timestamp: 2000-01-23T04:56:07.000+00:00
      properties:
        reason:
          $ref: "#/components/schemas/DeprovisionReason"
        timestamp:
          format: date-time
          type: string
      required:
      - timestamp
      type: object
    DeviceSubscribesToDesiredConfigurationRequestContent:
      description: Opaque MQTT payload — shape defined in cdd_sdk smithy.
      example:
        payload: ""
      properties:
        payload: {}
      type: object
    DeviceSubscribesToLogSubscriptionRequestContent:
      example:
        remotePath: remotePath
        expiresAt: 2000-01-23T04:56:07.000+00:00
      properties:
        expiresAt:
          format: date-time
          type: string
        remotePath:
          type: string
      type: object
    DeviceSubscribesToThumbnailSubscriptionRequestContent:
      example:
        requests:
          key:
            headers:
              key: headers
            remotePath: remotePath
            periodSeconds: 0.8008281904610115
            expiresAt: 2000-01-23T04:56:07.000+00:00
            maxSizeKB: 6.027456183070403
      properties:
        requests:
          additionalProperties:
            $ref: "#/components/schemas/ThumbnailRequest"
          description: |-
            Map of channelId to ThumbnailRequest. The host subscribes by channel.
            The SDK resolves the channel's thumbnail local path from ActualConfiguration.
          type: object
      required:
      - requests
      type: object
    DeviceType:
      enum:
      - SOURCE
      - DESTINATION
      - BOTH
      type: string
    GetHostConfigResponseContent:
      example:
        thumbnailMaximumSizeKB: 0.8008281904610115
        authenticatePairingCodeUrl: authenticatePairingCodeUrl
        deviceTypes:
        - SOURCE
        - SOURCE
        createPairingCodeUrl: createPairingCodeUrl
        logFileMaximumSizeKB: 6.027456183070403
        serviceId: serviceId
        serviceName: serviceName
      properties:
        serviceId:
          type: string
        serviceName:
          type: string
        deviceTypes:
          items:
            $ref: "#/components/schemas/DeviceType"
          type: array
        thumbnailMaximumSizeKB:
          type: number
        logFileMaximumSizeKB:
          type: number
        createPairingCodeUrl:
          type: string
        authenticatePairingCodeUrl:
          type: string
      required:
      - authenticatePairingCodeUrl
      - createPairingCodeUrl
      - deviceTypes
      - logFileMaximumSizeKB
      - serviceId
      - serviceName
      - thumbnailMaximumSizeKB
      type: object
    GetVersionResponseContent:
      example:
        version:
          version: 4.0.0
      properties:
        version:
          $ref: "#/components/schemas/ProtocolVersion"
      required:
      - version
      type: object
    HostSettings:
      example:
        pairingTimeoutSeconds: 0.8008281904610115
        deviceSubscribesToThumbnailSubscriptionTopic: deviceSubscribesToThumbnailSubscriptionTopic
        deviceSubscribesToDeprovisionTopic: deviceSubscribesToDeprovisionTopic
        devicePublishesStatusTopic: devicePublishesStatusTopic
        deviceSubscribesToCertificateRotationTopic: deviceSubscribesToCertificateRotationTopic
        minimumIntervalPublishSeconds: 6.027456183070403
        devicePublishesRegistrationTopic: devicePublishesRegistrationTopic
        deviceSubscribesToLogSubscriptionTopic: deviceSubscribesToLogSubscriptionTopic
        deviceSubscribesToDesiredConfigurationTopic: deviceSubscribesToDesiredConfigurationTopic
        mqttKeepaliveSeconds: 1.4658129805029452
        mqttAlpnProtocol: mqttAlpnProtocol
        devicePublishesActualConfigurationTopic: devicePublishesActualConfigurationTopic
        devicePublishesDeprovisionAcknowledgementTopic: devicePublishesDeprovisionAcknowledgementTopic
      properties:
        mqttAlpnProtocol:
          type: string
        pairingTimeoutSeconds:
          type: number
        minimumIntervalPublishSeconds:
          type: number
        mqttKeepaliveSeconds:
          type: number
        deviceSubscribesToDesiredConfigurationTopic:
          description: Device subscribes — host publishes desired configuration to
            this topic.
          type: string
        deviceSubscribesToThumbnailSubscriptionTopic:
          description: Device subscribes — host publishes thumbnail subscription requests
            to this topic.
          type: string
        devicePublishesRegistrationTopic:
          description: Device publishes — device reports its registration to this
            topic on connect.
          type: string
        devicePublishesStatusTopic:
          description: Device publishes — device reports its current status to this
            topic.
          type: string
        devicePublishesActualConfigurationTopic:
          description: Device publishes — device reports its actual applied configuration
            to this topic.
          type: string
        deviceSubscribesToCertificateRotationTopic:
          description: Device subscribes — host publishes new certificates to this
            topic.
          type: string
        devicePublishesDeprovisionAcknowledgementTopic:
          description: Device publishes — device acknowledges deprovision by publishing
            to this topic.
          type: string
        deviceSubscribesToDeprovisionTopic:
          description: Device subscribes — host publishes deprovision command to this
            topic.
          type: string
        deviceSubscribesToLogSubscriptionTopic:
          description: Device subscribes — host publishes log upload requests to this
            topic.
          type: string
      required:
      - devicePublishesActualConfigurationTopic
      - devicePublishesDeprovisionAcknowledgementTopic
      - devicePublishesRegistrationTopic
      - devicePublishesStatusTopic
      - deviceSubscribesToCertificateRotationTopic
      - deviceSubscribesToDeprovisionTopic
      - deviceSubscribesToDesiredConfigurationTopic
      - deviceSubscribesToLogSubscriptionTopic
      - deviceSubscribesToThumbnailSubscriptionTopic
      - minimumIntervalPublishSeconds
      - mqttAlpnProtocol
      - mqttKeepaliveSeconds
      - pairingTimeoutSeconds
      type: object
    PairingCodeAuthorizedStatus:
      enum:
      - STANDBY
      - CLAIMED
      type: string
    ProtocolVersion:
      example:
        version: 4.0.0
      properties:
        version:
          default: 4.0.0
          type: string
      type: object
    StringMap:
      additionalProperties:
        type: string
      type: object
    ThumbnailRequest:
      example:
        headers:
          key: headers
        remotePath: remotePath
        periodSeconds: 0.8008281904610115
        expiresAt: 2000-01-23T04:56:07.000+00:00
        maxSizeKB: 6.027456183070403
      properties:
        periodSeconds:
          type: number
        expiresAt:
          format: date-time
          type: string
        maxSizeKB:
          type: number
        remotePath:
          type: string
        headers:
          additionalProperties:
            type: string
          type: object
      type: object
    ThumbnailRequestMap:
      additionalProperties:
        $ref: "#/components/schemas/ThumbnailRequest"
      description: |-
        Map of channelId to ThumbnailRequest. The host subscribes by channel.
        The SDK resolves the channel's thumbnail local path from ActualConfiguration.
      type: object
    success:
      example:
        success:
          pairingTimeoutSeconds: 0.8008281904610115
          accessCode: accessCode
          deviceId: deviceId
          pairingCode: pairingCode
      properties:
        success:
          $ref: "#/components/schemas/CreatePairingCodeSuccessData"
      required:
      - success
      title: success
      type: object
    failure:
      properties:
        failure:
          $ref: "#/components/schemas/CreatePairingCodeFailureData"
      required:
      - failure
      title: failure
      type: object
